# Yggdrasil / Heimdall — Monitor SLA de internet (dual ISP)
# Decisiones: ADR-0001 (stack Prometheus + Grafana), ADR-0002 (placement en el appliance),
# ADR-0003 (host-mode solo para las sondas). Nombres: servicio = nombre nórdico (naming.md);
# container_name = tecnología real, para que `docker ps` sea legible por terceros.
#
# Presupuesto RNF01 (RAM ≤ 1.5 GB): mem_limit 64 + 128 + 512 + 128 + 256 (Heimdall) + 64 + 256
# (Ratatosk y Nornas, servicios de plataforma, ADR-0006) = 1408 MB.
# Puertos publicados, todos solo en la IP LAN (${HOST_LAN_IP}): Odín 3000, Ratatosk 1883 y el editor
# de Nornas 1880. Las sondas
# en host-mode escuchan en la IP de docker0 (${DOCKER_HOST_GW}) para que Mimir las scrapee sin
# exponerlas a la LAN ni a las WAN; la política INPUT de nftables es la segunda barrera (T2).
name: yggdrasil

x-comun: &comun
  restart: unless-stopped            # RNF02: vuelve solo tras un corte de energía
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"                # json-file no rota por defecto
      max-file: "3"

services:
  # Huginn y Muninn — blackbox_exporter: sondas ICMP y TCP/TLS con source IP por WAN
  huginn-muninn:
    <<: *comun
    image: prom/blackbox-exporter:v0.28.0
    container_name: yggdrasil-blackbox-exporter
    network_mode: host               # necesita ver wan1/wan2 (ADR-0003)
    cap_drop: [ALL]
    cap_add: [NET_RAW]               # ICMP; ver además net.ipv4.ping_group_range en README
    read_only: true
    mem_limit: 64m
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro   # renderizado por scripts/render.sh
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=${DOCKER_HOST_GW:-172.17.0.1}:9115
      - --log.level=info

  # Sleipnir — sonda de throughput (speedtest-cli o iperf3); expone /metrics con busybox httpd
  sleipnir:
    <<: *comun
    build: ./sleipnir
    image: ghcr.io/higerotech/yggdrasil-sleipnir:${IMAGE_TAG:-local}   # CD: sha-<7>; local: build
    container_name: yggdrasil-throughput-probe
    network_mode: host               # bind del source IP por WAN (ADR-0003)
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    environment:
      TZ: ${TZ:-UTC}
      WAN1_IF: ${WAN1_IF}
      WAN2_IF: ${WAN2_IF}
      SLEIPNIR_MODO: ${SLEIPNIR_MODO:-speedtest}
      SLEIPNIR_INTERVALO: ${SLEIPNIR_INTERVALO:-10800}
      SLEIPNIR_LISTEN: ${DOCKER_HOST_GW:-172.17.0.1}:9469
      IPERF3_SERVER: ${IPERF3_SERVER:-}
    volumes:
      - sleipnir-datos:/var/lib/sleipnir

  # Mimir — Prometheus: TSDB 30 d, recording rules y alertas del contrato
  mimir:
    <<: *comun
    image: prom/prometheus:v3.14.0
    container_name: yggdrasil-prometheus
    read_only: true
    mem_limit: 512m
    extra_hosts:
      - host.docker.internal:host-gateway   # alcanza a las sondas en host-mode
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - mimir-datos:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d    # RF06
      - --web.enable-lifecycle                # POST /-/reload desde la red interna
      - --web.listen-address=:9090
    networks: [heimdall]
    # sin `ports:` → solo alcanzable desde la red heimdall (ADR-0003, T2)
    depends_on: [gjallarhorn]

  # Gjallarhorn — Alertmanager: agrupa, inhibe y rutea al webhook de Nornas
  gjallarhorn:
    <<: *comun
    image: prom/alertmanager:v0.34.0
    container_name: yggdrasil-alertmanager
    read_only: true
    mem_limit: 128m
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro   # renderizado
      - gjallarhorn-datos:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
    networks: [heimdall]

  # Odín — Grafana: dashboards comparativos; único puerto publicado, solo en la LAN
  odin:
    <<: *comun
    image: grafana/grafana:12.4.10
    container_name: yggdrasil-grafana
    mem_limit: 256m
    ports:
      - "${HOST_LAN_IP}:3000:3000"   # RS01: bind explícito a la IP LAN; nunca 0.0.0.0
    environment:
      TZ: ${TZ:-UTC}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"       # RS01 / T1
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SECURE: "false"       # HTTP en LAN/WireGuard; poner true detrás de TLS
      GF_SERVER_ROOT_URL: http://${HOST_LAN_IP}:3000/
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ""   # sin plugins no firmados (STRIDE Elevation)
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/heimdall-sla.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - odin-datos:/var/lib/grafana
    networks: [heimdall]
    depends_on: [mimir]

  # --- Servicios de plataforma (ADR-0006): compartidos por Heimdall, Fenrir y la domótica ---

  # Ratatosk — Mosquitto 2: bus de eventos. Auth obligatoria y ACL por usuario (T3); el archivo de
  # contraseñas se genera al arrancar a partir de .env, dentro del volumen de datos.
  ratatosk:
    <<: *comun
    image: eclipse-mosquitto:2.0.22
    container_name: yggdrasil-mosquitto
    read_only: true
    mem_limit: 64m
    ports:
      - "${HOST_LAN_IP}:1883:1883"   # Fenrir y dispositivos IoT de la LAN, con usuario y contraseña
    environment:
      MQTT_NORNAS_PASSWORD: ${MQTT_NORNAS_PASSWORD}
      MQTT_FRIGATE_PASSWORD: ${MQTT_FRIGATE_PASSWORD}
      MQTT_IOT_PASSWORD: ${MQTT_IOT_PASSWORD}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ratatosk-datos:/mosquitto/data
    tmpfs:
      - /tmp
    networks: [heimdall]
    command:
      - /bin/sh
      - -c
      - >-
        set -e; P=/mosquitto/data/passwd;
        mosquitto_passwd -c -b "$$P" nornas "$$MQTT_NORNAS_PASSWORD";
        mosquitto_passwd -b "$$P" frigate "$$MQTT_FRIGATE_PASSWORD";
        mosquitto_passwd -b "$$P" iot "$$MQTT_IOT_PASSWORD";
        cp /mosquitto/config/acl /mosquitto/data/acl;
        chown mosquitto:mosquitto "$$P" /mosquitto/data/acl; chmod 0600 "$$P" /mosquitto/data/acl;
        exec /docker-entrypoint.sh mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u nornas -P \"$$MQTT_NORNAS_PASSWORD\" -t midgard/ratatosk/salud -m 1 -q 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Nornas — Node-RED 4: automatización sobre eventos. Editor con autenticación (settings.js),
  # publicado solo en la IP LAN. Recibe el webhook de Gjallarhorn por la red interna.
  nornas:
    <<: *comun
    image: nodered/node-red:4.1.14-22
    container_name: yggdrasil-node-red
    user: "1000:1000"
    mem_limit: 256m
    ports:
      - "${HOST_LAN_IP}:1880:1880"   # editor, solo LAN y WireGuard
    environment:
      TZ: ${TZ:-UTC}
      NORNAS_ADMIN_USER: ${NORNAS_ADMIN_USER:-admin}
      NORNAS_ADMIN_PASSWORD: ${NORNAS_ADMIN_PASSWORD}
      NORNAS_CREDENTIAL_SECRET: ${NORNAS_CREDENTIAL_SECRET}
      NORNAS_WEBHOOK_TOKEN: ${NORNAS_WEBHOOK_TOKEN}   # lo lee el nodo de autorización del flujo
      YGG_WANS: ${YGG_WANS:-wan1,wan2}                # WANs que el flujo considera para el estado del hogar
    volumes:
      - nornas-datos:/data
      - ./nornas/settings.js:/data/settings.js:ro
    networks: [heimdall]
    depends_on:
      ratatosk:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1880/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # nornas-init — tarea de un solo uso: importa el flujo de Heimdall por la Admin API e inyecta las
  # credenciales MQTT de nornas (idempotente: no toca nada si la pestaña Heimdall ya existe).
  nornas-init:
    image: nodered/node-red:4.1.14-22
    container_name: yggdrasil-node-red-init
    user: "1000:1000"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    entrypoint: ["node", "/init/importar-flujo.mjs"]
    environment:
      NORNAS_ADMIN_USER: ${NORNAS_ADMIN_USER:-admin}
      NORNAS_ADMIN_PASSWORD: ${NORNAS_ADMIN_PASSWORD}
      MQTT_NORNAS_PASSWORD: ${MQTT_NORNAS_PASSWORD}
    volumes:
      - ./nornas/init:/init:ro
      - ./nornas/flows:/flujos:ro
    networks: [heimdall]
    depends_on:
      nornas:
        condition: service_healthy

networks:
  heimdall:
    name: yggdrasil_heimdall

volumes:
  mimir-datos:
  gjallarhorn-datos:
  odin-datos:
  sleipnir-datos:
  ratatosk-datos:
  nornas-datos:
