# Pruebas de los recordatorios de calendario. Ejecutar:
#   promtool test rules deploy/prometheus/tests/recordatorios.test.yml
# promtool empieza en t=0 = 1970-01-01 00:00 UTC, que en Caracas (UTC-4) es el 31-dic a las 20:00.
# El día 1 de enero en Caracas va de 04:00 UTC (4h) a 04:00 UTC del 2 (28h); las 08:00 son las 12h.
rule_files:
  - ../rules/recordatorios.yml

evaluation_interval: 1m

tests:
  - name: el pago de Servitel avisa el día 1 de 08:00 a 23:59 hora de Caracas
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3h59m      # 31-dic 23:59 en Caracas
        alertname: RecordatorioPagoServitel
        exp_alerts: []
      - eval_time: 11h59m     # 1-ene 07:59 en Caracas: aún no
        alertname: RecordatorioPagoServitel
        exp_alerts: []
      - eval_time: 12h        # 1-ene 08:00 en Caracas
        alertname: RecordatorioPagoServitel
        exp_alerts: &pago_servitel
          - exp_labels:
              severity: warning
              servicio: heimdall
              tipo: recordatorio
              proveedor: servitel
            exp_annotations:
              resumen: "Hoy vence el pago de Servitel (wan1)"
              descripcion: "Si no se paga hoy, Servitel corta wan1 en la madrugada del día 2. Así se ve el corte: el router de Servitel responde, pero devuelve `net unreachable` a todo lo de fuera y la luz PON de la ONT parpadea. No es una avería; se arregla pagando."
      - eval_time: 27h59m     # 1-ene 23:59 en Caracas: sigue
        alertname: RecordatorioPagoServitel
        exp_alerts: *pago_servitel
      - eval_time: 28h        # 2-ene 00:00 en Caracas: se acabó el día 1
        alertname: RecordatorioPagoServitel
        exp_alerts: []
      - eval_time: 400h       # 17-ene: ningún otro día
        alertname: RecordatorioPagoServitel
        exp_alerts: []
      - eval_time: 768h       # 1-feb 20:00 en Caracas: el mes siguiente también
        alertname: RecordatorioPagoServitel
        exp_alerts: *pago_servitel

  - name: la factura de NetUno avisa el día 1 de 08:00 a 23:59 hora de Caracas
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 11h59m     # 1-ene 07:59 en Caracas: aún no
        alertname: RecordatorioFacturaNetUno
        exp_alerts: []
      - eval_time: 12h        # 1-ene 08:00 en Caracas
        alertname: RecordatorioFacturaNetUno
        exp_alerts:
          - exp_labels: {severity: warning, servicio: heimdall, tipo: recordatorio, proveedor: netuno}
            exp_annotations:
              resumen: "NetUno (wan2) emitió la factura del mes: vence el día 17"
              descripcion: "NetUno corta wan2 el día 18 si la factura sigue sin pagar. El día 17 llega otro recordatorio."
      - eval_time: 28h        # 2-ene 00:00 en Caracas
        alertname: RecordatorioFacturaNetUno
        exp_alerts: []

  - name: el último día de pago de NetUno avisa el día 17, y el 18 ya no
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 12h        # el día 1 avisa la factura, no esta
        alertname: RecordatorioPagoNetUno
        exp_alerts: []
      - eval_time: 395h59m    # 17-ene 07:59 en Caracas: aún no
        alertname: RecordatorioPagoNetUno
        exp_alerts: []
      - eval_time: 396h       # 17-ene 08:00 en Caracas
        alertname: RecordatorioPagoNetUno
        exp_alerts: &pago_netuno
          - exp_labels: {severity: warning, servicio: heimdall, tipo: recordatorio, proveedor: netuno}
            exp_annotations:
              resumen: "Último día para pagar NetUno (wan2): mañana corta"
              descripcion: "Si la factura del día 1 sigue sin pagar, NetUno corta wan2 el día 18. Con wan2 cortada, todo el tráfico de la casa sale por wan1."
      - eval_time: 411h59m    # 17-ene 23:59 en Caracas: sigue
        alertname: RecordatorioPagoNetUno
        exp_alerts: *pago_netuno
      - eval_time: 412h       # 18-ene 00:00 en Caracas: día de corte, ya no avisa
        alertname: RecordatorioPagoNetUno
        exp_alerts: []
