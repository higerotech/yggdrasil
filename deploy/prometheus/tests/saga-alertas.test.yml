# Pruebas de las alertas de Saga. Ejecutar:
#   promtool test rules deploy/prometheus/tests/saga-alertas.test.yml
rule_files:
  - ../rules/saga-alertas.yml

evaluation_interval: 15s

tests:
  - name: Saga deja de responder
    interval: 1m
    input_series:
      - series: 'up{job="saga", instance="saga:3200"}'
        values: '1x3 0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: SagaCaida
        exp_alerts: []
      - eval_time: 6m
        alertname: SagaCaida
        exp_alerts: []          # caída hace 3 min: aún dentro del for
      - eval_time: 10m
        alertname: SagaCaida
        exp_alerts:
          - exp_labels: {severity: warning, servicio: saga, job: saga, instance: "saga:3200"}
            exp_annotations:
              resumen: "Saga no responde: las trazas de este rato se pierden"
              descripcion: "Mimir no lee saga:3200 desde hace 5 minutos. Revisar `docker logs yggdrasil-tempo` y que el SSD esté montado en /srv/rapido (sin él, Saga no arranca)."

  - name: Saga sana no avisa
    interval: 1m
    input_series:
      - series: 'up{job="saga", instance="saga:3200"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: SagaCaida
        exp_alerts: []
