# Pruebas de las alertas de Thor. Ejecutar:
#   promtool test rules deploy/prometheus/tests/thor-alertas.test.yml
rule_files:
  - ../rules/thor-alertas.yml

evaluation_interval: 15s

tests:
  - name: discrepancias entre Heimdall y la ruta del balanceador
    interval: 1m
    input_series:
      # wan1 sana y en la ruta: nada
      - series: 'wan:up{wan="wan1"}'
        values: '1x20'
      - series: 'yggdrasil_wan_en_ruta{job="thor", wan="wan1"}'
        values: '1x20'
      # wan2 sana pero fuera de la ruta
      - series: 'wan:up{wan="wan2"}'
        values: '1x20'
      - series: 'yggdrasil_wan_en_ruta{job="thor", wan="wan2"}'
        values: '0x20'
      - series: 'hogar:up'
        values: '1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: WanSanaFueraDeRuta
        exp_alerts: []          # aún dentro del for de 10 min
      - eval_time: 12m
        alertname: WanSanaFueraDeRuta
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, wan: wan2}
            exp_annotations:
              resumen: "wan2 sana según Heimdall pero fuera de la ruta del balanceador"
              descripcion: "Se está perdiendo la capacidad de wan2. Revisar `journalctl -t wan-balancer` y `ip route show default`."
      - eval_time: 12m
        alertname: WanCaidaEnRuta
        exp_alerts: []

  - name: una WAN viva que pierde paquetes, fuera de la ruta, no es una discrepancia
    interval: 1m
    input_series:
      - series: 'wan:up{wan="wan2"}'
        values: '1x50'
      - series: 'yggdrasil_wan_en_ruta{job="thor", wan="wan2"}'
        values: '0x50'
      # 20 % de pérdida 10 min (caso 2026-10-21) y después limpia
      - series: 'wan:perdida_pct:5m{wan="wan2"}'
        values: '20x10 0x40'
      - series: 'hogar:up'
        values: '1x50'
    alert_rule_test:
      - eval_time: 20m
        alertname: WanSanaFueraDeRuta
        exp_alerts: []          # con pérdida, el balanceador hace bien en sacarla
      - eval_time: 30m
        alertname: WanSanaFueraDeRuta
        exp_alerts: []          # 15 min de margen tras la pérdida y luego el for de 10 min
      - eval_time: 40m
        alertname: WanSanaFueraDeRuta
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, wan: wan2}
            exp_annotations:
              resumen: "wan2 sana según Heimdall pero fuera de la ruta del balanceador"
              descripcion: "Se está perdiendo la capacidad de wan2. Revisar `journalctl -t wan-balancer` y `ip route show default`."

  - name: una WAN caída que el balanceador mantiene en la ruta
    interval: 1m
    input_series:
      - series: 'wan:up{wan="wan1"}'
        values: '1x20'
      - series: 'wan:up{wan="wan2"}'
        values: '0x20'
      - series: 'yggdrasil_wan_en_ruta{job="thor", wan="wan1"}'
        values: '1x20'
      - series: 'yggdrasil_wan_en_ruta{job="thor", wan="wan2"}'
        values: '1x20'
      - series: 'hogar:up'
        values: '1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: WanCaidaEnRuta
        exp_alerts:
          - exp_labels: {severity: critical, servicio: thor, wan: wan2}
            exp_annotations:
              resumen: "wan2 caída según Heimdall pero el balanceador la mantiene en la ruta"
              descripcion: "Parte de las conexiones de la casa salen por un enlace roto. Revisar `journalctl -t wan-balancer` y `systemctl status wan-balancer`."

  - name: con las dos WAN caídas el balanceador conserva la ruta a propósito
    interval: 1m
    input_series:
      - series: 'wan:up{wan="wan1"}'
        values: '0x20'
      - series: 'wan:up{wan="wan2"}'
        values: '0x20'
      - series: 'yggdrasil_wan_en_ruta{job="thor", wan="wan1"}'
        values: '1x20'
      - series: 'yggdrasil_wan_en_ruta{job="thor", wan="wan2"}'
        values: '0x20'
      - series: 'hogar:up'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: WanCaidaEnRuta
        exp_alerts: []

  - name: el disco empeora y el cable da errores
    interval: 1h
    input_series:
      # pendientes: 8 durante un día y luego 16 (lo visto entre el 5 y el 16 de octubre)
      - series: 'yggdrasil_smart_atributo{disco="sda", id="197", nombre="Current_Pending_Sector"}'
        values: '8x24 16x30'
      # incorregibles estables: no avisan
      - series: 'yggdrasil_smart_atributo{disco="sda", id="198", nombre="Offline_Uncorrectable"}'
        values: '16x54'
      # horas encendido suben siempre: no deben contar
      - series: 'yggdrasil_smart_atributo{disco="sda", id="9", nombre="Power_On_Hours"}'
        values: '37000+1x54'
      - series: 'yggdrasil_smart_atributo{disco="sda", id="199", nombre="UDMA_CRC_Error_Count"}'
        values: '229963x24 229970x30'
    alert_rule_test:
      - eval_time: 20h
        alertname: DiscoEmpeora
        exp_alerts: []
      - eval_time: 26h
        alertname: DiscoEmpeora
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, disco: sda, id: "197", nombre: Current_Pending_Sector}
            exp_annotations:
              resumen: "Disco sda: Current_Pending_Sector subió 8 en 24 h"
              descripcion: "El disco de midgard se degrada. Los respaldos diarios están en el NAS; planificar el cambio de disco. Detalle: `sudo smartctl -A /dev/sda`."
      - eval_time: 26h
        alertname: DiscoErroresDeCable
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, disco: sda, id: "199", nombre: UDMA_CRC_Error_Count}
            exp_annotations:
              resumen: "Disco sda: 7 errores CRC nuevos del cable SATA en 24 h"
      - eval_time: 50h           # 24 h sin nuevas subidas: se resuelve sola
        alertname: DiscoEmpeora
        exp_alerts: []

  - name: el NAS se llena
    interval: 1h
    input_series:
      # 3,6 TB; libre baja de 200 GB a ~130 GB en una semana (10 GB al día): lleno en ~13 días
      - series: 'yggdrasil_fs_tamano_bytes{punto="/mnt/nas/respaldos"}'
        values: '3600000000000x200'
      - series: 'yggdrasil_fs_libre_bytes{punto="/mnt/nas/respaldos"}'
        values: '200000000000-416666667x200'
      - series: 'yggdrasil_fs_montado{punto="/mnt/nas/respaldos"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 170h
        alertname: NasSeLlena
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, punto: /mnt/nas/respaldos}
            exp_annotations:
              resumen: "El NAS de respaldos se llenará en menos de 14 días al ritmo de la última semana"
      - eval_time: 170h
        alertname: NasEspacioCritico
        exp_alerts: []         # aún ~3,6 % libre

  - name: el NAS no responde
    interval: 1m
    input_series:
      - series: 'yggdrasil_fs_montado{punto="/mnt/nas/respaldos"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: NasNoMontado
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, punto: /mnt/nas/respaldos}
            exp_annotations:
              resumen: "El NAS de respaldos no está montado o no responde: el respaldo nocturno fallará"

  - name: el SSD se cae del bus con SMART limpio
    interval: 1m
    input_series:
      - series: 'yggdrasil_disco_errores_kernel_15m{disco="sda"}'
        values: '0x20'
      # 5 errores en el minuto 10; 15 min después el registro ya no los cuenta
      - series: 'yggdrasil_disco_errores_kernel_15m{disco="sdb"}'
        values: '0x9 5x14 0x10'
      - series: 'yggdrasil_smart_salud{disco="sdb"}'
        values: '1x35'
    alert_rule_test:
      - eval_time: 11m
        alertname: DiscoErroresKernel
        exp_alerts:
          - exp_labels: {severity: critical, servicio: thor, disco: sdb}
            exp_annotations:
              resumen: "Disco sdb: 5 errores del enlace SATA o de E/S en el kernel en 15 min"
              descripcion: "El disco puede estar cayéndose del bus. Detalle: `journalctl -k --since -1h | grep -E 'ata|I/O error|EXT4'`. Si sigue, parar lo que escribe en él y reconectar el cable."
      - eval_time: 11m
        alertname: DiscoSmartFalla
        exp_alerts: []
      - eval_time: 30m
        alertname: DiscoErroresKernel
        exp_alerts: []

  - name: el SSD de datos sin montar
    interval: 1m
    input_series:
      - series: 'yggdrasil_fs_montado{punto="/"}'
        values: '1x20'
      - series: 'yggdrasil_fs_montado{punto="/mnt/nas/respaldos"}'
        values: '0x20'
      - series: 'yggdrasil_fs_montado{punto="/srv/rapido"}'
        values: '1 1 0x18'
    alert_rule_test:
      - eval_time: 5m
        alertname: PuntoNoMontado
        exp_alerts: []
      - eval_time: 8m
        alertname: PuntoNoMontado
        exp_alerts:
          - exp_labels: {severity: critical, servicio: thor, punto: /srv/rapido}
            exp_annotations:
              resumen: "/srv/rapido no está montado: los servicios que guardan ahí sus datos no arrancan"

  - name: un respaldo se atrasa y el otro no
    # cada minuto, como Thor: con muestras más espaciadas que los 5 min de lookback la serie desaparece
    interval: 1m
    input_series:
      # yggdrasil se completa cada minuto; bifrost se quedó en el momento 0
      - series: 'yggdrasil_respaldo_ultimo_exito_timestamp_seconds{respaldo="yggdrasil"}'
        values: '0+60x2000'
      - series: 'yggdrasil_respaldo_ultimo_exito_timestamp_seconds{respaldo="bifrost"}'
        values: '0x2000'
    alert_rule_test:
      - eval_time: 29h
        alertname: RespaldoAtrasado
        exp_alerts: []
      - eval_time: 31h
        alertname: RespaldoAtrasado
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, respaldo: bifrost}
            exp_annotations:
              resumen: "El respaldo bifrost lleva más de 30 h sin completarse"

  - name: Thor deja de publicar
    interval: 1m
    input_series:
      - series: 'up{job="thor", instance="thor:9471"}'
        values: '1x20'
      # el recolector se paró en el minuto 2: la marca de tiempo deja de avanzar
      - series: 'yggdrasil_thor_timestamp_seconds{job="thor", instance="thor:9471"}'
        values: '0 60 120 120x17'
    alert_rule_test:
      - eval_time: 15m
        alertname: ThorSinMetricas
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, job: thor, instance: "thor:9471"}
            exp_annotations:
              resumen: "Mimir no recibe métricas frescas del host (Thor): disco, NAS y discrepancias sin vigilancia"

  - name: Andvari sellado avisa una vez, por el sello
    interval: 1m
    input_series:
      - series: 'yggdrasil_andvari_sellado{job="thor", instance="thor:9471"}'
        values: '0x2 1x10'
      # Sellado, su healthcheck lo cuenta como no sano.
      - series: 'yggdrasil_servicio_ok{job="thor", instance="thor:9471", tipo="contenedor", nombre="andvari-openbao"}'
        values: '1x2 0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: AndvariSellado
        exp_alerts: []          # sellado hace 1 min: aún dentro del for
      - eval_time: 8m
        alertname: AndvariSellado
        exp_alerts:
          - exp_labels: {severity: critical, servicio: andvari, job: thor, instance: "thor:9471"}
            exp_annotations:
              resumen: "Andvari está sellado: el gateway no abre ninguna clave y responde 503"
              descripcion: "Revisar `docker exec andvari-openbao bao status` y que exista /srv/infra/andvari/secretos/sello.key; después, `docker logs andvari-openbao`."
      - eval_time: 10m
        alertname: ServicioDePlataformaCaido
        exp_alerts: []          # el mismo problema no avisa dos veces

  - name: un contenedor de la plataforma caído
    interval: 1m
    input_series:
      - series: 'yggdrasil_servicio_ok{job="thor", instance="thor:9471", tipo="contenedor", nombre="bifrost-nats"}'
        values: '1x2 0x10'
      # Andvari caído y no sellado: sin respuesta de bao status, Thor no publica el sello.
      - series: 'yggdrasil_servicio_ok{job="thor", instance="thor:9471", tipo="contenedor", nombre="andvari-openbao"}'
        values: '0x12'
      - series: 'yggdrasil_servicio_ok{job="thor", instance="thor:9471", tipo="contenedor", nombre="hermod-rabbitmq"}'
        values: '1x12'
      # Uno del proyecto: lo vigila el vigía de servicios, no esta alerta.
      - series: 'yggdrasil_servicio_ok{job="thor", instance="thor:9471", tipo="contenedor", nombre="yggdrasil-grafana"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: ServicioDePlataformaCaido
        exp_alerts: []          # caídos, pero aún dentro del for de 5 min
      - eval_time: 9m
        alertname: ServicioDePlataformaCaido
        exp_alerts:
          - exp_labels: {severity: critical, servicio: plataforma, job: thor, instance: "thor:9471", tipo: contenedor, nombre: andvari-openbao}
            exp_annotations:
              resumen: "andvari-openbao está caído o no sano"
              descripcion: "Revisar `docker ps -a --filter name=andvari-openbao` y `docker logs andvari-openbao`. Sin Andvari el gateway no abre claves; sin Bifröst, el webhook responde 503; sin Hermod, el motor no recibe."
          - exp_labels: {severity: critical, servicio: plataforma, job: thor, instance: "thor:9471", tipo: contenedor, nombre: bifrost-nats}
            exp_annotations:
              resumen: "bifrost-nats está caído o no sano"
              descripcion: "Revisar `docker ps -a --filter name=bifrost-nats` y `docker logs bifrost-nats`. Sin Andvari el gateway no abre claves; sin Bifröst, el webhook responde 503; sin Hermod, el motor no recibe."


  - name: el túnel PIA sin desvío y el servicio parado
    interval: 1m
    input_series:
      - series: 'yggdrasil_pia_desvio_activo{job="thor", instance="thor:9471"}'
        values: '1x2 0x10'
      - series: 'yggdrasil_pia_equipos{job="thor", instance="thor:9471"}'
        values: '1x12'
      - series: 'yggdrasil_servicio_ok{job="thor", instance="thor:9471", tipo="unidad", nombre="pia-tunel.service"}'
        values: '1x2 0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: TunelPiaSinDesvio
        exp_alerts: []          # aún dentro del for de 5 min
      - eval_time: 9m
        alertname: TunelPiaSinDesvio
        exp_alerts:
          - exp_labels: {severity: warning, servicio: pia, job: thor, instance: "thor:9471"}
            exp_annotations:
              resumen: "Los equipos del túnel PIA salen directo, sin PIA"
              descripcion: "El túnel no responde o PIA rechaza la clave. Revisar `journalctl -t pia-tunel` y `wg show pia0`; las credenciales están en /etc/yggdrasil-pia.env."
      - eval_time: 9m
        alertname: TunelPiaCaido
        exp_alerts:
          - exp_labels: {severity: warning, servicio: pia, job: thor, instance: "thor:9471", tipo: unidad, nombre: pia-tunel.service}
            exp_annotations:
              resumen: "pia-tunel.service está parado: los equipos del túnel salen directo"
              descripcion: "Revisar `systemctl status pia-tunel` y `journalctl -t pia-tunel`. Sin /etc/yggdrasil-pia.env la unidad no arranca."

  - name: el túnel PIA sin equipos configurados no avisa
    interval: 1m
    input_series:
      - series: 'yggdrasil_pia_desvio_activo{job="thor", instance="thor:9471"}'
        values: '0x12'
      - series: 'yggdrasil_pia_equipos{job="thor", instance="thor:9471"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: TunelPiaSinDesvio
        exp_alerts: []

  # --- Otro host (nidavellir): sus series llevan `host` y los avisos lo nombran ---------------------
  - name: un disco de nidavellir empeora
    interval: 1h
    input_series:
      - series: 'yggdrasil_smart_atributo{job="thor", instance="192.168.10.2:9471", host="nidavellir", disco="sdc", id="197", nombre="Current_Pending_Sector"}'
        values: '0x23 1x5'
    alert_rule_test:
      - eval_time: 26h
        alertname: DiscoEmpeora
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, job: thor, instance: "192.168.10.2:9471", host: nidavellir, disco: sdc, id: "197", nombre: Current_Pending_Sector}
            exp_annotations:
              resumen: "Disco sdc de nidavellir: Current_Pending_Sector subió 1 en 24 h"
              descripcion: "El disco de nidavellir se degrada: planificar el cambio y comprobar que lo que guarda tiene copia. Detalle: `sudo smartctl -A /dev/sdc` en nidavellir."

  - name: el NAS sin montar en nidavellir avisa como punto suyo, no como el NAS de midgard
    interval: 1m
    input_series:
      - series: 'yggdrasil_fs_montado{job="thor", instance="thor:9471", punto="/mnt/nas/respaldos"}'
        values: '1x40'
      - series: 'yggdrasil_fs_montado{job="thor", instance="192.168.10.2:9471", host="nidavellir", punto="/mnt/nas/respaldos"}'
        values: '1 1 0x38'
      - series: 'yggdrasil_fs_libre_bytes{job="thor", instance="192.168.10.2:9471", host="nidavellir", punto="/mnt/nas/respaldos"}'
        values: '1x40'
      - series: 'yggdrasil_fs_tamano_bytes{job="thor", instance="192.168.10.2:9471", host="nidavellir", punto="/mnt/nas/respaldos"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: PuntoNoMontado
        exp_alerts:
          - exp_labels: {severity: critical, servicio: thor, job: thor, instance: "192.168.10.2:9471", host: nidavellir, punto: /mnt/nas/respaldos}
            exp_annotations:
              resumen: "/mnt/nas/respaldos de nidavellir no está montado: los servicios que guardan ahí sus datos no arrancan"
      - eval_time: 35m
        alertname: NasNoMontado
        exp_alerts: []
      # 1 % libre visto desde nidavellir: el espacio del NAS solo cuenta medido por midgard
      - eval_time: 35m
        alertname: NasEspacioCritico
        exp_alerts: []

  - name: nidavellir deja de responder
    interval: 1m
    input_series:
      - series: 'up{job="thor", instance="192.168.10.2:9471", host="nidavellir"}'
        values: '1 1 0x18'
    alert_rule_test:
      - eval_time: 5m
        alertname: ThorSinMetricas
        exp_alerts: []          # aún dentro del for de 5 min
      - eval_time: 10m
        alertname: ThorSinMetricas
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, job: thor, instance: "192.168.10.2:9471", host: nidavellir}
            exp_annotations:
              resumen: "Mimir no recibe métricas de nidavellir: está colgado, apagado o sin red"

  - name: nidavellir arranca de nuevo y midgard no
    interval: 1m
    input_series:
      # midgard arrancó un día antes del inicio de la prueba; nidavellir, en el momento 0
      - series: 'yggdrasil_arranque_timestamp_seconds{job="thor", instance="thor:9471"}'
        values: '-86400x30'
      - series: 'yggdrasil_arranque_timestamp_seconds{job="thor", instance="192.168.10.2:9471", host="nidavellir"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: HostReiniciado
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, job: thor, instance: "192.168.10.2:9471", host: nidavellir}
            exp_annotations:
              resumen: "nidavellir arrancó hace menos de 15 min"
              descripcion: "Si nadie lo reinició, fue un apagón o un cuelgue que resolvió el watchdog. Lo último que registró antes de caer: `journalctl -b -1 -n 50`."
      - eval_time: 16m
        alertname: HostReiniciado
        exp_alerts: []          # se resuelve sola a los 15 min

  - name: midgard arranca tras un apagón
    interval: 1m
    input_series:
      - series: 'yggdrasil_arranque_timestamp_seconds{job="thor", instance="thor:9471"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: HostReiniciado
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, job: thor, instance: "thor:9471"}
            exp_annotations:
              resumen: "midgard arrancó hace menos de 15 min"
              descripcion: "Si nadie lo reinició, fue un apagón o un cuelgue que resolvió el watchdog. Lo último que registró antes de caer: `journalctl -b -1 -n 50`."

  - name: un servicio caído en nidavellir avisa por Mimir; en midgard lo hace el vigía
    interval: 1m
    input_series:
      - series: 'yggdrasil_servicio_ok{job="thor", instance="192.168.10.2:9471", host="nidavellir", tipo="unidad", nombre="docker.service"}'
        values: '1x2 0x10'
      - series: 'yggdrasil_servicio_ok{job="thor", instance="192.168.10.2:9471", host="nidavellir", tipo="contenedor", nombre="bragi"}'
        values: '1x2 0x10'
      - series: 'yggdrasil_servicio_ok{job="thor", instance="thor:9471", tipo="contenedor", nombre="yggdrasil-grafana"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: ServicioDeHostCaido
        exp_alerts: []          # aún dentro del for de 5 min
      - eval_time: 9m
        alertname: ServicioDeHostCaido
        exp_alerts:
          - exp_labels: {severity: critical, servicio: thor, job: thor, instance: "192.168.10.2:9471", host: nidavellir, tipo: unidad, nombre: docker.service}
            exp_annotations:
              resumen: "docker.service está caído en nidavellir"
              descripcion: "Revisar `systemctl status docker.service` en nidavellir."
          - exp_labels: {severity: critical, servicio: thor, job: thor, instance: "192.168.10.2:9471", host: nidavellir, tipo: contenedor, nombre: bragi}
            exp_annotations:
              resumen: "bragi está caído en nidavellir"
              descripcion: "Revisar `docker ps -a --filter name=bragi` y `docker logs bragi` en nidavellir."

  - name: Baldr con pendientes avisa 12 h; sin pendientes, nada
    interval: 1m
    input_series:
      # nidavellir terminó a t=0 (epoch 0 en promtool) con 2 pendientes; midgard con 0
      - series: 'yggdrasil_baldr_pendientes{job="thor", instance="192.168.10.2:9471", host="nidavellir"}'
        values: '2x30'
      - series: 'yggdrasil_baldr_terminado_timestamp_seconds{job="thor", instance="192.168.10.2:9471", host="nidavellir"}'
        values: '0x30'
      - series: 'yggdrasil_baldr_pendientes{job="thor", instance="thor:9471"}'
        values: '0x30'
      - series: 'yggdrasil_baldr_terminado_timestamp_seconds{job="thor", instance="thor:9471"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: BaldrConPendientes
        exp_alerts:
          - exp_labels: {severity: warning, servicio: baldr, job: thor, instance: "192.168.10.2:9471", host: nidavellir}
            exp_annotations:
              resumen: "Tras el arranque de nidavellir quedan 2 pendientes"
              descripcion: "Baldr no pudo dejarlo todo bien. Detalle en `/var/lib/yggdrasil-baldr/resumen` de nidavellir."

  - name: los pendientes de Baldr caducan a las 12 h
    interval: 1h
    input_series:
      - series: 'yggdrasil_baldr_pendientes{job="thor", instance="thor:9471"}'
        values: '1x14'
      - series: 'yggdrasil_baldr_terminado_timestamp_seconds{job="thor", instance="thor:9471"}'
        values: '0x14'
    alert_rule_test:
      - eval_time: 11h
        alertname: BaldrConPendientes
        exp_alerts:
          - exp_labels: {severity: warning, servicio: baldr, job: thor, instance: "thor:9471"}
            exp_annotations:
              resumen: "Tras el arranque quedan 1 pendientes"
              descripcion: "Baldr no pudo dejarlo todo bien. Detalle en `/var/lib/yggdrasil-baldr/resumen`."
      - eval_time: 13h
        alertname: BaldrConPendientes
        exp_alerts: []

  - name: Baldr sin terminar tras 3 h 10 min desde el arranque
    interval: 10m
    input_series:
      # arrancó en t=0; Baldr terminó por última vez antes (arranque anterior)
      - series: 'yggdrasil_arranque_timestamp_seconds{job="thor", instance="thor:9471"}'
        values: '0x25'
      - series: 'yggdrasil_baldr_terminado_timestamp_seconds{job="thor", instance="thor:9471"}'
        values: '-1000x25'
    alert_rule_test:
      - eval_time: 3h
        alertname: BaldrSinTerminar
        exp_alerts: []
      - eval_time: 3h20m
        alertname: BaldrSinTerminar
        exp_alerts:
          - exp_labels: {severity: warning, servicio: baldr, job: thor, instance: "thor:9471"}
            exp_annotations:
              resumen: "Baldr no terminó tras el último arranque"
              descripcion: "Revisar `journalctl -u yggdrasil-baldr -b`."

  - name: unidad fallida y contenedor caído fuera de las listas; sin duplicar lo que ya avisa servicio_ok
    interval: 1m
    input_series:
      - series: 'yggdrasil_unidad_fallida{job="thor", instance="thor:9471", nombre="mnt-nas-descargas.mount"}'
        values: '1x20'
      # también en THOR_UNIDADES y a 0: ya avisa el vigía, no se duplica
      - series: 'yggdrasil_unidad_fallida{job="thor", instance="192.168.10.2:9471", host="nidavellir", nombre="docker.service"}'
        values: '1x20'
      - series: 'yggdrasil_servicio_ok{job="thor", instance="192.168.10.2:9471", host="nidavellir", tipo="unidad", nombre="docker.service"}'
        values: '0x20'
      - series: 'yggdrasil_contenedor_caido{job="thor", instance="thor:9471", nombre="transmission"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: UnidadFallida
        exp_alerts: []          # aún dentro del for de 15 min
      - eval_time: 16m
        alertname: UnidadFallida
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, job: thor, instance: "thor:9471", nombre: mnt-nas-descargas.mount}
            exp_annotations:
              resumen: "mnt-nas-descargas.mount ha fallado"
              descripcion: "Revisar `systemctl status mnt-nas-descargas.mount` y `journalctl -u mnt-nas-descargas.mount -b`. Si ya no hace falta: `sudo systemctl reset-failed mnt-nas-descargas.mount`."
      - eval_time: 11m
        alertname: ContenedorCaido
        exp_alerts:
          - exp_labels: {severity: warning, servicio: thor, job: thor, instance: "thor:9471", nombre: transmission}
            exp_annotations:
              resumen: "El contenedor transmission murió y no ha vuelto"
              descripcion: "Revisar `docker ps -a --filter name=transmission` y `docker logs transmission`."
