# Alertas sobre las métricas del host que publica Thor (deploy/cd/yggdrasil-thor.sh): coherencia
# entre Heimdall y la ruta real del balanceador, salud de los discos, espacio del NAS de respaldos y
# reinicios. Sin etiqueta `wan` salvo las dos de discrepancia; Nornas las entrega por ntfy.
#
# Las series de midgard no llevan `host`; las de otro host (nidavellir), si (prometheus.yml, job thor).
# Los avisos nombran el host solo cuando lo hay: los de midgard se leen como siempre.
groups:
  - name: thor_alertas
    rules:
      # --- Heimdall frente a wan-balancer (RCA del 2026-10-06, acción 6) -----------------------
      # Los dos dan una WAN por viva con el mismo criterio (mayoría de 3 destinos TCP), así que una
      # discrepancia sostenida no es de criterio: es una IP desfasada, un balanceador colgado o un
      # fallo de una de las dos mediciones. 10 min absorben la histéresis del balanceador y el `for`
      # de WanCaida.
      #
      # Desde 2026-10-21 el balanceador saca además una WAN viva que pierde paquetes (ventana de
      # 2 min, ~6 %). Eso no es una discrepancia: `unless` descarta la WAN con pérdida ≥ 1 % en los
      # últimos 15 min. Pasado ese margen, si sigue fuera, sí avisa.
      - alert: WanSanaFueraDeRuta
        expr: >-
          wan:up == 1 and on (wan) yggdrasil_wan_en_ruta{host=""} == 0
          unless on (wan) max_over_time(wan:perdida_pct:5m[15m]) >= 1
        for: 10m
        labels:
          severity: warning
          servicio: thor
        annotations:
          resumen: "{{ $labels.wan }} sana según Heimdall pero fuera de la ruta del balanceador"
          descripcion: >-
            Se está perdiendo la capacidad de {{ $labels.wan }}. Revisar
            `journalctl -t wan-balancer` y `ip route show default`.

      - alert: WanCaidaEnRuta
        # `hogar:up == 1`: con las dos WAN caídas el balanceador conserva la última ruta a propósito.
        expr: wan:up == 0 and on (wan) yggdrasil_wan_en_ruta{host=""} == 1 and on () hogar:up == 1
        for: 10m
        labels:
          severity: critical
          servicio: thor
        annotations:
          resumen: "{{ $labels.wan }} caída según Heimdall pero el balanceador la mantiene en la ruta"
          descripcion: >-
            Parte de las conexiones de la casa salen por un enlace roto. Revisar
            `journalctl -t wan-balancer` y `systemctl status wan-balancer`.

      # --- Discos -------------------------------------------------------------------
      # Atributos que anuncian la muerte del disco: reasignados (5), errores no corregidos (187),
      # pendientes (197) e incorregibles (198). Cualquier subida en 24 h avisa; la alerta se
      # resuelve sola 24 h después si no vuelven a subir. El 188 (Command_Timeout) se publica pero
      # no avisa: en los Seagate el RAW empaqueta tres contadores de 16 bits (en midgard vale
      # 68721442848) y una subida del contador alto se leería como "subió 4294967296".
      - alert: DiscoEmpeora
        # Diferencia exacta con el mínimo de 24 h (delta() extrapola y daba "subió 8.35").
        expr: >-
          yggdrasil_smart_atributo{id=~"5|187|197|198"}
            - min_over_time(yggdrasil_smart_atributo{id=~"5|187|197|198"}[24h]) > 0
        labels:
          severity: warning
          servicio: thor
        annotations:
          resumen: "Disco {{ $labels.disco }}{{ with $labels.host }} de {{ . }}{{ end }}: {{ $labels.nombre }} subió {{ $value }} en 24 h"
          descripcion: >-
            {{ if $labels.host }}El disco de {{ $labels.host }} se degrada: planificar el cambio y
            comprobar que lo que guarda tiene copia.{{ else }}El disco de midgard se degrada. Los respaldos
            diarios están en el NAS; planificar el cambio de disco.{{ end }} Detalle: `sudo smartctl -A
            /dev/{{ $labels.disco }}`{{ with $labels.host }} en {{ . }}{{ end }}.

      - alert: DiscoErroresDeCable
        expr: >-
          yggdrasil_smart_atributo{id="199"}
            - min_over_time(yggdrasil_smart_atributo{id="199"}[24h]) > 0
        labels:
          severity: warning
          servicio: thor
        annotations:
          resumen: "Disco {{ $labels.disco }}{{ with $labels.host }} de {{ . }}{{ end }}: {{ $value }} errores CRC nuevos del cable SATA en 24 h"

      - alert: DiscoSmartFalla
        expr: yggdrasil_smart_salud == 0 or yggdrasil_smart_lectura_ok == 0
        for: 30m
        labels:
          severity: critical
          servicio: thor
        annotations:
          resumen: "Disco {{ $labels.disco }}{{ with $labels.host }} de {{ . }}{{ end }}: SMART no pasa o no se puede leer"

      # smartctl no ve que un disco se caiga del bus: el SSD de datos se cayó así el 2026-10-19
      # con SMART limpio, tras timeouts de WRITE FPDMA QUEUED y resets del enlace.
      - alert: DiscoErroresKernel
        expr: yggdrasil_disco_errores_kernel_15m > 0
        labels:
          severity: critical
          servicio: thor
        annotations:
          resumen: "Disco {{ $labels.disco }}{{ with $labels.host }} de {{ . }}{{ end }}: {{ $value }} errores del enlace SATA o de E/S en el kernel en 15 min"
          descripcion: >-
            El disco puede estar cayéndose del bus. Detalle: `journalctl -k --since -1h | grep -E
            'ata|I/O error|EXT4'`. Si sigue, parar lo que escribe en él y reconectar el cable.

      # --- NAS de respaldos ---
      # El espacio del NAS es el mismo lo mida quien lo mida: solo cuentan las series de midgard, que
      # es quien respalda. Que no esté montado en otro host lo dice PuntoNoMontado.----------------------------------------------------------------
      - alert: NasSeLlena
        # Tendencia de 7 días: lo que importa es si se llena antes de poder actuar, no el %.
        expr: predict_linear(yggdrasil_fs_libre_bytes{punto="/mnt/nas/respaldos",host=""}[7d], 14 * 86400) < 0
        for: 1h
        labels:
          severity: warning
          servicio: thor
        annotations:
          resumen: "El NAS de respaldos se llenará en menos de 14 días al ritmo de la última semana"

      - alert: NasEspacioCritico
        expr: >-
          yggdrasil_fs_libre_bytes{punto="/mnt/nas/respaldos",host=""}
            / yggdrasil_fs_tamano_bytes{punto="/mnt/nas/respaldos",host=""} < 0.03
        for: 30m
        labels:
          severity: critical
          servicio: thor
        annotations:
          resumen: "NAS de respaldos con menos del 3 % libre"

      - alert: NasNoMontado
        expr: yggdrasil_fs_montado{punto="/mnt/nas/respaldos",host=""} == 0
        for: 30m
        labels:
          severity: warning
          servicio: thor
        annotations:
          resumen: "El NAS de respaldos no está montado o no responde: el respaldo nocturno fallará"

      # --- Otros puntos y respaldos del host --------------------------------------------------
      # Los puntos de THOR_PUNTOS que no son / ni el NAS son de datos (el SSD, /srv/rapido): lo
      # que vive en ellos no arranca sin el montaje. En otro host, también el NAS (NasNoMontado es de midgard).
      - alert: PuntoNoMontado
        expr: >-
          yggdrasil_fs_montado{punto!~"/|/mnt/nas/respaldos"} == 0
          or yggdrasil_fs_montado{punto="/mnt/nas/respaldos",host!=""} == 0
        for: 5m
        labels:
          severity: critical
          servicio: thor
        annotations:
          resumen: "{{ $labels.punto }}{{ with $labels.host }} de {{ . }}{{ end }} no está montado: los servicios que guardan ahí sus datos no arrancan"

      # 30 h, como Bragi: el respaldo es diario y Persistent=true lo recupera tras un apagón. El
      # aviso por ntfy de cada vigía sigue siendo el principal: no depende del stack.
      - alert: RespaldoAtrasado
        expr: time() - yggdrasil_respaldo_ultimo_exito_timestamp_seconds > 30 * 3600
        for: 30m
        labels:
          severity: warning
          servicio: thor
        annotations:
          resumen: "El respaldo {{ $labels.respaldo }} lleva más de 30 h sin completarse"

      # --- Túnel PIA (ADR-0009) -------------------------------------------------------------------
      # Con el túnel sin respuesta, pia-tunel.sh retira el desvío y los equipos de PIA_MACS salen directo:
      # siguen teniendo internet, pero por la IP del ISP y con su DNS. 5 min: el servicio reintenta cada 60 s.
      - alert: TunelPiaSinDesvio
        expr: yggdrasil_pia_desvio_activo == 0 and on () yggdrasil_pia_equipos > 0
        for: 5m
        labels:
          severity: warning
          servicio: pia
        annotations:
          resumen: "Los equipos del túnel PIA salen directo, sin PIA"
          descripcion: >-
            El túnel no responde o PIA rechaza la clave. Revisar `journalctl -t pia-tunel` y
            `wg show pia0`; las credenciales están en /etc/yggdrasil-pia.env.

      - alert: TunelPiaCaido
        # El estado del túnel desaparece con el servicio: quien avisa entonces es la unidad.
        expr: yggdrasil_servicio_ok{tipo="unidad",nombre="pia-tunel.service"} == 0
        for: 5m
        labels:
          severity: warning
          servicio: pia
        annotations:
          resumen: "pia-tunel.service está parado: los equipos del túnel salen directo"
          descripcion: >-
            Revisar `systemctl status pia-tunel` y `journalctl -t pia-tunel`. Sin /etc/yggdrasil-pia.env
            la unidad no arranca.

      # --- Infraestructura de midgard (THOR_CONTENEDORES, THOR_ANDVARI) ---------------------------
      # Andvari guarda la clave maestra del gateway: sellado, el gateway responde 503 a todo lo cifrado. Pasa si el
      # contenedor arranca sin su clave de sello (/srv/infra/andvari/secretos/sello.key) o con otra.
      - alert: AndvariSellado
        expr: yggdrasil_andvari_sellado == 1
        for: 2m
        labels:
          severity: critical
          servicio: andvari
        annotations:
          resumen: "Andvari está sellado: el gateway no abre ninguna clave y responde 503"
          descripcion: >-
            Revisar `docker exec andvari-openbao bao status` y que exista /srv/infra/andvari/secretos/sello.key;
            después, `docker logs andvari-openbao`.

      # Contenedores de /srv/infra que no vigila el vigía de servicios. Andvari sellado ya avisa con la suya: su
      # healthcheck (`bao status`) también lo cuenta como no sano.
      - alert: ServicioDePlataformaCaido
        expr: >-
          yggdrasil_servicio_ok{tipo="contenedor",nombre=~"bifrost-nats|hermod-rabbitmq"} == 0
          or (yggdrasil_servicio_ok{tipo="contenedor",nombre="andvari-openbao"} == 0
              unless on () yggdrasil_andvari_sellado == 1)
        for: 5m
        labels:
          severity: critical
          servicio: plataforma
        annotations:
          resumen: "{{ $labels.nombre }} está caído o no sano"
          descripcion: >-
            Revisar `docker ps -a --filter name={{ $labels.nombre }}` y `docker logs {{ $labels.nombre }}`. Sin
            Andvari el gateway no abre claves; sin Bifröst, el webhook responde 503; sin Hermod, el motor no recibe.

      # midgard tiene el vigía de servicios, que avisa directo a ntfy sin pasar por Mimir. Otro host no
      # lo tiene: por sus servicios avisa Mimir.
      - alert: ServicioDeHostCaido
        expr: yggdrasil_servicio_ok{host!=""} == 0
        for: 5m
        labels:
          severity: critical
          servicio: thor
        annotations:
          resumen: "{{ $labels.nombre }} está caído en {{ $labels.host }}"
          descripcion: >-
            Revisar {{ if eq $labels.tipo "unidad" }}`systemctl status {{ $labels.nombre }}`{{ else }}`docker ps -a
            --filter name={{ $labels.nombre }}` y `docker logs {{ $labels.nombre }}`{{ end }} en {{ $labels.host }}.

      # --- Reinicios -----------------------------------------------------------------------------
      # Un arranque que nadie pidió es un apagón (midgard no tiene UPS) o un cuelgue que resolvió el
      # watchdog: nidavellir se congelaba sin dejar nada en el registro (2026-10-25). Se resuelve sola a
      # los 15 min. Sin `for`: el host acaba de volver y es justo lo que hay que saber.
      - alert: HostReiniciado
        expr: time() - yggdrasil_arranque_timestamp_seconds < 900
        labels:
          severity: warning
          servicio: thor
        annotations:
          resumen: "{{ with $labels.host }}{{ . }}{{ else }}midgard{{ end }} arrancó hace menos de 15 min"
          descripcion: >-
            Si nadie lo reinició, fue un apagón o un cuelgue que resolvió el watchdog. Lo último que
            registró antes de caer: `journalctl -b -1 -n 50`.

      # --- Thor mismo --------------------------------------------------------------------------
      # En otro host, sin métricas casi siempre es el host: colgado, apagado o sin red.
      - alert: ThorSinMetricas
        expr: up{job="thor"} == 0 or (time() - yggdrasil_thor_timestamp_seconds) > 300
        for: 5m
        labels:
          severity: warning
          servicio: thor
        annotations:
          resumen: >-
            {{ if $labels.host }}Mimir no recibe métricas de {{ $labels.host }}: está colgado, apagado o sin
            red{{ else }}Mimir no recibe métricas frescas del host (Thor): disco, NAS y discrepancias sin
            vigilancia{{ end }}
