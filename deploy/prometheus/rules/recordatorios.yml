# Recordatorios de calendario: no miden nada, avisan de algo que hay que hacer a mano. Llevan
# `tipo: recordatorio`, y con eso Nornas no manda push al resolverse (nadie lo resolvió: se acabó el
# día) y Baldr no los cuenta como pendientes tras un arranque.
#
# Prometheus calcula las fechas en UTC. La casa está en America/Caracas (UTC-4 todo el año, sin
# horario de verano), así que se resta 4 h a `time()` antes de sacar el día y la hora.
groups:
  - name: recordatorios
    rules:
      # El 2026-11-02 a las 05:20 UTC (01:20 en Caracas) Servitel cortó wan1 por facturación: el
      # pago vence el día 1 y el corte llega esa misma madrugada. Casi 8 h sin wan1, y el diagnóstico
      # apuntaba a una avería (el router devolvía `net unreachable` y la luz PON parpadeaba).
      # Avisa el día 1 de 08:00 a 23:59 hora de Caracas: un solo push al empezar.
      - alert: RecordatorioPagoServitel
        expr: >-
          day_of_month(vector(time() - 4 * 3600)) == 1
          and on () hour(vector(time() - 4 * 3600)) >= 8
        labels:
          severity: warning
          servicio: heimdall
          tipo: recordatorio
          proveedor: servitel
        annotations:
          resumen: "Hoy vence el pago de Servitel (wan1)"
          descripcion: >-
            Si no se paga hoy, Servitel corta wan1 en la madrugada del día 2. Así se ve el corte: el
            router de Servitel responde, pero devuelve `net unreachable` a todo lo de fuera y la luz
            PON de la ONT parpadea. No es una avería; se arregla pagando.

      # NetUno factura el día 1 y corta el 18: un aviso con la factura y otro el último día de pago.
      - alert: RecordatorioFacturaNetUno
        expr: >-
          day_of_month(vector(time() - 4 * 3600)) == 1
          and on () hour(vector(time() - 4 * 3600)) >= 8
        labels:
          severity: warning
          servicio: heimdall
          tipo: recordatorio
          proveedor: netuno
        annotations:
          resumen: "NetUno (wan2) emitió la factura del mes: vence el día 17"
          descripcion: >-
            NetUno corta wan2 el día 18 si la factura sigue sin pagar. El día 17 llega otro recordatorio.

      - alert: RecordatorioPagoNetUno
        expr: >-
          day_of_month(vector(time() - 4 * 3600)) == 17
          and on () hour(vector(time() - 4 * 3600)) >= 8
        labels:
          severity: warning
          servicio: heimdall
          tipo: recordatorio
          proveedor: netuno
        annotations:
          resumen: "Último día para pagar NetUno (wan2): mañana corta"
          descripcion: >-
            Si la factura del día 1 sigue sin pagar, NetUno corta wan2 el día 18. Con wan2 cortada, todo
            el tráfico de la casa sale por wan1.
