# Recording rules del contrato de métricas (docs/02-design/architecture.md).
# La latencia se toma de probe_icmp_duration_seconds{phase="rtt"} (RTT real de la sonda) y no
# de probe_duration_seconds, que incluye resolución y setup. blackbox expone un gauge por
# sonda, no un histograma: los percentiles se calculan con quantile_over_time en 5 min y se
# promedian entre los objetivos de cada WAN. Desde 2026-10-17 son tres: 208.67.222.222 queda a
# ~59 ms por wan1 (1.1.1.1 ~49, 8.8.8.8 ~33), así que la latencia de wan1 sube ~6 ms ese día
# sin que el enlace cambie; por wan2 los tres están a ~33 ms.
groups:
  - name: heimdall_sli_5m
    interval: 15s
    rules:
      # Pérdida del enlace = MEDIANA de la pérdida de los 3 objetivos ICMP (1.1.1.1, 8.8.8.8 y
      # 208.67.222.222) que responden algo en la ventana. La pérdida del enlace la ven todos los
      # objetivos; la de un solo destino es de ese destino y la mediana la descarta.
      #  - `> 0` saca a un objetivo caído del todo: TA-05 mostró que con la media simple un solo
      #    objetivo bloqueado daba 50 % y disparaba WanDegradada y WanNoAptaLlamadas. Con dos
      #    objetivos vivos, quantile interpola y la mediana es su media.
      #  - Hasta 2026-10-17 era la media de 1.1.1.1 y 8.8.8.8. Google descarta ping a 8.8.8.8 a ratos
      #    (por TLS respondía al 99,8 %): en 7 días wan1 sumó 838 min ≥ 1 % y solo 153 con el mejor
      #    objetivo. Quedarse con el mejor de dos perdía sensibilidad (5 % de pérdida real: la alerta
      #    disparaba en el 73 % de las simulaciones, frente al 94 % de la media); la mediana de tres
      #    dispara en el 97 % y no la mueve ningún objetivo suelto.
      - record: wan:perdida_pct:5m
        expr: 100 * (1 - quantile by (wan) (0.5, avg_over_time(probe_success{job=~"blackbox_icmp_wan[0-9]+"}[5m]) > 0))

      - record: wan:latencia_p90:5m
        expr: avg by (wan) (quantile_over_time(0.90, probe_icmp_duration_seconds{job=~"blackbox_icmp_wan[0-9]+", phase="rtt"}[5m]))
      - record: wan:latencia_p95:5m
        expr: avg by (wan) (quantile_over_time(0.95, probe_icmp_duration_seconds{job=~"blackbox_icmp_wan[0-9]+", phase="rtt"}[5m]))
      - record: wan:latencia_p99:5m
        expr: avg by (wan) (quantile_over_time(0.99, probe_icmp_duration_seconds{job=~"blackbox_icmp_wan[0-9]+", phase="rtt"}[5m]))

      # Quórum RF01: la WAN está arriba si responden ≥ 2 de sus 3 sondas TCP+TLS (www.gstatic.com,
      # 1.1.1.1 y 8.8.8.8 por el puerto 443). Hasta 2026-10-06 eran 2 ICMP + 1 TLS: ese día wan2
      # respondía a los ping pero TCP estaba roto, y con dos votos ICMP seguía "arriba". Las
      # sondas ICMP siguen midiendo pérdida y latencia. wan-balancer y wan-watchdog usan los
      # mismos tres destinos y la misma mayoría (deploy/host/tests/prueba-quorum.sh lo comprueba).
      - record: wan:up
        expr: (sum by (wan) (probe_success{job=~"blackbox_tls_wan[0-9]+"}) >= bool 2)
      - record: hogar:up
        expr: max(wan:up)

      # RF08 define la disponibilidad del hogar como "el tiempo con al menos una WAN
      # operativa" (glosario), y `hogar:up` implementa esa definición. Lo que la definición
      # no cubre es que la casa salga de verdad: las sondas por WAN fijan IP de origen y
      # viajan por las tablas `wan1`/`wan2`, nunca por `main`, que es por donde salen la LAN,
      # dnsmasq y los contenedores. El 2026-09-12 `main` estuvo 7 h sin ruta utilizable con
      # las dos WAN sanas, y `hogar:up` valió 1 durante todo el corte.
      #
      # `hogar:ruta_up` mide ese otro camino con el mismo quórum que `wan:up`: 2 de 3
      # objetivos (2 ICMP + 1 TLS). Es una serie nueva; no sustituye a `hogar:up` ni altera
      # la disponibilidad de 30 días ya reportada en Gate 3.
      - record: hogar:ruta_up
        expr: (sum(probe_success{job=~"hogar_(icmp|tls)"}) >= bool 2)

      # Apta para llamadas: p95 < 200 ms y pérdida < 1 % (indicador ortogonal al estado).
      - record: wan:apto_llamadas
        expr: (wan:latencia_p95:5m < bool 0.2) * on (wan) (wan:perdida_pct:5m < bool 1)

  - name: heimdall_slo_throughput
    # 1m y no 5m (2026-10-16): Prometheus guarda la muestra de cada evaluacion con la hora del
    # hueco alineado del grupo, y si la evaluacion arranca un instante antes de ese hueco usa el
    # ANTERIOR. Con 5m cada muestra nacia con >5 min de antiguedad, fuera del lookback-delta
    # (5m): las consultas instantaneas salian vacias, los paneles de 30 dias de Odin sin datos
    # y WanThroughputBajo ciega. Con 1m la muestra mas nueva tiene como mucho ~2 min.
    # deploy/prometheus/tests/intervalos.py exige intervalos <= 1m en el CI.
    interval: 1m
    rules:
      # SLO de throughput = el porcentaje del plan que GARANTIZA por contrato cada proveedor
      # (decisión de Gate 0: el 80 % de entonces era la garantía del ISP2 de aquella época).
      # Codificarlo aquí evita que el contrato viva solo en la cabeza de quien opera y hace que
      # un cambio de plan sea un commit trazable. Planes vigentes desde el 2026-10-30:
      #
      #   wan1  Servitel  1000 / 1000 Mbps, garantía 90 %  ->  900 bajada / 900 subida
      #   wan2  NetUno     400 /  400 Mbps, garantía 90 %  ->  360 bajada / 360 subida
      #
      # wan2 era Silverdata (1000 / 500, garantía 80 %: 800 / 400) hasta el cambio a NetUno
      # hacia el 2026-10-19. Con estos umbrales, en los 30 días previos wan1 no habría alertado
      # (una sola lectura de subida bajo 900, 828 Mbps) y wan2 solo entre el 21 y el 24-oct,
      # cuando NetUno entregó 180-370 Mbps de bajada.
      #
      # `* 0 +` hereda las etiquetas (wan, direccion, job, instance) de la métrica de Sleipnir,
      # así que el umbral casa 1:1 con la serie que vigila.
      - record: wan:slo_throughput_mbps
        expr: |
          (wan_throughput_mbps{wan="wan1"}    * 0 + 900)
          or (wan_throughput_mbps{wan="wan2"} * 0 + 360)

  - name: heimdall_disponibilidad_30d
    # 1m: ver heimdall_slo_throughput.
    interval: 1m
    rules:
      - record: wan:disponibilidad:30d
        expr: avg_over_time(wan:up[30d])
      - record: hogar:disponibilidad:30d
        expr: avg_over_time(hogar:up[30d])
      - record: hogar:ruta_disponibilidad:30d
        expr: avg_over_time(hogar:ruta_up[30d])
