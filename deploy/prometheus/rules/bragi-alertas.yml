# COPIA de higerotech/bragi :: deploy/prometheus/bragi-alertas.yml (ADR-0009 de Bragi).
# La especificación, los umbrales y sus pruebas unitarias (promtool test rules) viven en Bragi:
# cambiarlos allí y copiar aquí, nunca al revés.
# Reglas de Bragi para Mimir (Prometheus de Yggdrasil) — ADR-0009.
#
# ESPECIFICACION: se instala en higerotech/yggdrasil como deploy/prometheus/rules/bragi-alertas.yml.
# Vive aqui para que los umbrales queden trazados a los requisitos que los justifican.
# Pruebas: promtool test rules deploy/prometheus/bragi-alertas.test.yml
#
# Entrega: sin etiqueta `wan`, Nornas convierte cada alerta en un aviso push "Heimdall: <alerta>"
# con su `resumen`. Solo avisa al dispararse, no al resolverse.
groups:
  - name: bragi-registro
    rules:
      # Fraccion del tope de CPU en uso (0..1). Incluye los ffmpeg: salen del cgroup.
      - record: bragi:cpu_uso:ratio_5m
        expr: rate(bragi_cpu_usage_seconds_total[5m]) / (bragi_cpu_limit_cores > 0)
      # Fraccion de periodos en que el cgroup choco con el tope: la señal exacta de "en el tope".
      - record: bragi:cpu_limitado:ratio_5m
        expr: rate(bragi_cpu_throttled_periods_total[5m]) / rate(bragi_cpu_periods_total[5m])

  - name: bragi
    rules:
      - alert: BragiCaido
        expr: bragi_up{comprobacion="lan"} == 0
        for: 3m   # un despliegue reinicia Jellyfin ~30 s; el primer arranque en el HDD, ~3 min
        labels:
          severity: critical
          servicio: bragi
        annotations:
          resumen: "Bragi no responde en la LAN"
          descripcion: "/health no devuelve 200 desde hace 3 min. Diagnóstico: docker ps --filter name=bragi y journalctl -u bragi-arranque."

      # Solo si dentro vive (si no, ya salta BragiCaido) y si la casa tiene ruta (si no, ya
      # salta HogarSinRuta de Heimdall): la causa probable es el tunel o Cloudflare.
      - alert: BragiExternoCaido
        expr: >-
          (bragi_up{comprobacion="externo"} == 0)
          and on() (bragi_up{comprobacion="lan"} == 1)
          unless on() (hogar:ruta_up == 0)
        for: 5m
        labels:
          severity: warning
          servicio: bragi
        annotations:
          resumen: "Bragi no responde desde fuera (túnel) aunque en la LAN sí"
          descripcion: "Comprobar bragi-tunel (docker logs bragi-tunel) y el estado del túnel en Cloudflare."

      - alert: BragiSinMetricas
        expr: up{job="bragi"} == 0 or (time() - bragi_collector_timestamp_seconds) > 180
        for: 3m
        labels:
          severity: warning
          servicio: bragi
        annotations:
          resumen: "Heimdall no recibe métricas de Bragi"
          descripcion: "El recolector (bragi-metricas.timer) o el contenedor bragi-metricas no funcionan: sin ellos ninguna otra alerta de Bragi puede saltar."

      # T10, ADR-0008. 30 h: el respaldo es diario y Persistent=true lo recupera tras un apagon.
      - alert: BragiRespaldoAtrasado
        expr: (time() - bragi_backup_last_success_timestamp_seconds) > 30 * 3600
        for: 10m
        labels:
          severity: warning
          servicio: bragi
        annotations:
          resumen: "Bragi lleva más de 30 h sin un respaldo verificado"
          descripcion: "Revisar systemctl status bragi-respaldo y que el share respaldos del NAS monte."

      # ADR-0002 y RF03: con cpus 3.0 y superfast cabe uno a 1,13x.
      - alert: BragiMasDeUnTranscode
        expr: bragi_transcodes > 1
        for: 2m
        labels:
          severity: warning
          servicio: bragi
        annotations:
          resumen: "Bragi está haciendo más de un transcode a la vez"
          descripcion: "Con el tope de 3 CPU solo cabe uno a tiempo real (ADR-0002): los demás se entrecortan. Ver qué clientes no reproducen en directo."

      # Estar en el tope durante un transcode es lo diseñado, no un fallo. Lo anomalo es estar
      # cerca del tope SIN transcodificar: una tarea pesada fuera de su ventana o un atasco.
      - alert: BragiCpuAltaSinTranscode
        expr: bragi:cpu_uso:ratio_5m > 0.8 and on() bragi_transcodes == 0
        for: 20m
        labels:
          severity: warning
          servicio: bragi
        annotations:
          resumen: "Bragi usa más del 80 % de su tope de CPU sin ningún transcode"
          descripcion: "Suele ser una tarea pesada fuera de la ventana de madrugada o un proceso atascado. Comprobar con politicas.sh --verificar y el panel de tareas de Jellyfin."

      # Memoria ANONIMA: la total incluye la cache de paginas, que el kernel libera sola.
      - alert: BragiMemoriaAlta
        expr: bragi_memory_bytes{tipo="anon"} / on() (bragi_memory_limit_bytes > 0) > 0.85
        for: 15m
        labels:
          severity: warning
          servicio: bragi
        annotations:
          resumen: "La memoria de Bragi pasa del 85 % de su tope de 2 GiB"
          descripcion: "Cerca del tope el kernel mata procesos del contenedor (OOM). Revisar transcodes y tareas en curso."

      # RNF02: el streaming no debe degradar el enrutamiento. Informativa: correlaciona, no
      # demuestra causa.
      - alert: BragiTranscodeConWanDegradada
        expr: >-
          bragi_transcodes > 0
          and on() (count(ALERTS{alertstate="firing", alertname=~"WanDegradada|WanCaida|HogarSinRuta"}) > 0)
        for: 1m
        labels:
          severity: info
          servicio: bragi
        annotations:
          resumen: "Hay un transcode de Bragi en curso mientras una WAN está degradada"
          descripcion: "Correlación para revisar si el transcode afecta al router (RNF02). Con el tope y cpu_shares no debería: si coincide a menudo, revisar ADR-0002."
