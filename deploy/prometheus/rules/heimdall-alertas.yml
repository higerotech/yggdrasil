# Alertas del contrato (tabla "Alertas" en docs/02-design/architecture.md). Umbrales SLO de
# Gate 0: pérdida < 1 %, p95 < 500 ms (Degradado), p95 < 200 ms (apto_llamadas), throughput
# ≥ 80 % del nominal contratado por WAN y dirección (`wan:slo_throughput_mbps`, recording).
# `HogarSinRuta` es la única que no mira un enlace sino la tabla `main` (la ruta de la casa). Las anotaciones `estado` y `apto_llamadas` las consume el flujo de Nornas.
groups:
  - name: heimdall_alertas
    rules:
      - alert: WanCaida
        expr: wan:up == 0
        for: 2m
        labels:
          severity: critical
          servicio: heimdall
        annotations:
          estado: caido
          resumen: "{{ $labels.wan }} caída: el quórum de sondas no responde"
          descripcion: "Al menos 2 de los 3 objetivos fallan por {{ $labels.wan }} desde hace 2 min."

      - alert: WanDegradada
        # min_over_time(wan:up[5m]): la WAN debe llevar toda la ventana arriba; tras una caida la ventana
        # de perdida arrastra los fallos del corte y disparaba una degradacion falsa (TA-14, v0.4.7).
        expr: (wan:perdida_pct:5m > 1 or wan:latencia_p95:5m > 0.5) and on (wan) min_over_time(wan:up[5m]) == 1
        for: 5m
        labels:
          severity: warning
          servicio: heimdall
        annotations:
          estado: degradado
          resumen: "{{ $labels.wan }} degradada: pérdida > 1 % o p95 > 500 ms durante 5 min"
          descripcion: "Revisar wan:perdida_pct:5m y wan:latencia_p95:5m de {{ $labels.wan }} en Odín."

      - alert: WanNoAptaLlamadas
        expr: wan:apto_llamadas == 0 and on (wan) min_over_time(wan:up[5m]) == 1
        for: 5m
        labels:
          severity: info
          servicio: heimdall
        annotations:
          apto_llamadas: "no"
          resumen: "{{ $labels.wan }} no apta para llamadas: p95 > 200 ms o pérdida > 1 %"

      # Dos mediciones consecutivas por debajo (cada WAN se mide cada 6 h → for: 12h).
      # Vigila las DOS direcciones: hasta el 2026-09-16 solo miraba la bajada, así que una caída
      # de la subida de cualquiera de las dos WAN pasaba inadvertida. El umbral no está escrito a
      # mano: sale de `wan:slo_throughput_mbps`, que codifica el nominal contratado con cada ISP.
      - alert: WanThroughputBajo
        expr: >
          wan_throughput_mbps < on (wan, direccion) wan:slo_throughput_mbps
          and on (wan) wan_throughput_medicion_ok == 1
        for: 12h
        labels:
          severity: warning
          servicio: heimdall
        annotations:
          resumen: "{{ $labels.wan }} bajo el SLO de {{ $labels.direccion }}: {{ $value | printf \"%.0f\" }} Mbps"

      # Las sondas por WAN no pueden ver esto: fijan IP de origen y viajan por las tablas
      # `wan1`/`wan2`, que wan-balancer mantiene con default propio. `HogarSinRuta` vigila la
      # tabla `main`, por donde salen de verdad la LAN, dnsmasq y los contenedores.
      #
      # Si esta alerta se enciende con `wan:up` a 1 en las dos WAN, el problema NO es de los
      # ISP: es la ruta por defecto de `main` o el resolutor del appliance. Eso fue lo que
      # pasó el 2026-09-12 (7 h sin internet en casa, Heimdall todo en verde), y se resolvió
      # con `systemctl restart dnsmasq wan-balancer`.
      - alert: HogarSinRuta
        expr: hogar:ruta_up == 0
        for: 2m
        labels:
          severity: critical
          servicio: heimdall
        annotations:
          resumen: "La casa no sale a internet: la ruta por defecto de `main` no responde"
          descripcion: >-
            El quórum de sondas sin IP de origen (2 de 3) falla desde hace 2 min. Comprobar
            `wan:up` de cada WAN: si ambas valen 1, el fallo esta en la tabla `main` o en
            dnsmasq, no en los ISP. Diagnostico: `ip route get 1.1.1.1` y
            `systemctl status wan-balancer dnsmasq`.

      - alert: SleipnirSinMedicion
        expr: (time() - wan_throughput_ultima_medicion_timestamp_seconds) > 8 * 3600
        for: 10m
        labels:
          severity: warning
          servicio: heimdall
        annotations:
          resumen: "Sleipnir lleva más de 8 h sin medir {{ $labels.wan }}"

      - alert: SondaCaida
        expr: up{job=~"blackbox_.*|huginn_muninn|sleipnir"} == 0
        for: 5m
        labels:
          severity: warning
          servicio: heimdall
        annotations:
          resumen: "Mimir no consigue scrapear {{ $labels.job }} ({{ $labels.instance }})"
