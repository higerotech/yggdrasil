# Alertas de las piezas de Hive que viven en la plataforma: Bifröst (NATS), el bus del motor, y Zitadel,
# el IdP de las personas (ADR-0029 de Hive). Desde el 2026-11-02 las dos corren en nidavellir (ADR-0012,
# fase 2). Sin etiqueta `wan`: Nornas las entrega por ntfy.
#
# Un contenedor en bucle de reinicios responde de vez en cuando: el 2026-10-28 `bifrost-nats` pasó 77 min
# reiniciándose cada minuto, la muestra suelta en que estaba en marcha volvía a poner a cero el `for` de
# ServicioDePlataformaCaido y el aviso llegó 33 min tarde. Por eso BifrostCaido no mira la última muestra.
groups:
  - name: hive
    rules:
      # --- Bifröst ---------------------------------------------------------------------------------
      # Hasta el 2026-11-02 era una sonda de blackbox al `/healthz` de NATS en el loopback de midgard. En
      # nidavellir ese puerto no sale del host, así que mira la salud del contenedor que publica Thor de
      # nidavellir una vez por minuto (la del healthcheck de la imagen, que pide `/healthz` con JetStream).
      # Thor cuenta como sano un contenedor recién arrancado, y en un bucle de reinicios alguna muestra sale
      # sana: avisa cuando hay al menos una muestra mala en cada ventana de 5 min durante 6 min seguidos.
      # Un fallo suelto no llega, porque su ventana dura 5 min. Si es todo nidavellir, avisa ThorSinMetricas.
      - alert: BifrostCaido
        expr: min_over_time(yggdrasil_servicio_ok{tipo="contenedor",nombre="bifrost-nats"}[5m]) == 0
        for: 6m
        labels:
          severity: critical
          servicio: bifrost
        annotations:
          resumen: "Bifröst (NATS) no está sano: el motor de Hive no procesa mensajes"
          descripcion: >-
            El contenedor `bifrost-nats` de nidavellir no está sano o se reinicia. Revisar `docker logs bifrost-nats`.
            Con `Can't start JetStream`, comprobar que el almacén está montado: `findmnt /var/lib/bifrost` debe
            mostrar `[/srv/datos/bifrost]`.

      # --- Zitadel ---------------------------------------------------------------------------------
      # Solo si la casa tiene ruta: sin ella ya salta HogarSinRuta.
      - alert: ZitadelExternoCaido
        expr: >-
          avg_over_time(probe_success{job="zitadel_externo"}[3m]) < 0.5
          unless on () (hogar:ruta_up == 0)
        for: 1m
        labels:
          severity: critical
          servicio: zitadel
        annotations:
          resumen: "Zitadel (hive-auth.higerotech.com) no responde desde fuera"
          descripcion: >-
            Las personas no pueden entrar y hive-api no valida sus tokens. En nidavellir: `docker ps --filter
            name=hive-idp` y `docker logs hive-idp-tunel`. Si nidavellir no responde, salta también
            ThorSinMetricas.

      # El respaldo es diario (03:30 UTC) y Persistent=true lo recupera tras un apagón: 26 h dan dos horas
      # de margen sobre la pasada siguiente.
      - alert: ZitadelRespaldoAtrasado
        expr: time() - hive_idp_respaldo_ultimo_exito_segundos > 26 * 3600
        for: 10m
        labels:
          severity: warning
          servicio: zitadel
        annotations:
          resumen: "El respaldo de Zitadel lleva más de 26 h sin salir bien"
          descripcion: >-
            Revisar `systemctl status hive-idp-respaldo` y `journalctl -u hive-idp-respaldo` en nidavellir, y
            que `/mnt/nas/respaldos` esté montado.

      # La pasada deja el 0 hasta la siguiente: la alerta dura lo que dura el fallo.
      - alert: ZitadelRespaldoFallido
        expr: hive_idp_respaldo_resultado == 0
        for: 5m
        labels:
          severity: warning
          servicio: zitadel
        annotations:
          resumen: "La última pasada del respaldo de Zitadel falló"
          descripcion: >-
            El motivo está en `journalctl -u hive-idp-respaldo` en nidavellir. Lanzarla otra vez tras arreglarlo:
            `sudo systemctl start hive-idp-respaldo.service`.

      # Sin el fichero, las dos de arriba no pueden saltar. Si es todo nidavellir, ya avisa ThorSinMetricas.
      - alert: ZitadelRespaldoSinMetricas
        expr: >-
          up{job="hive_idp_respaldo"} == 0
          unless on () (up{job="thor",host="nidavellir"} == 0)
        for: 30m
        labels:
          severity: warning
          servicio: zitadel
        annotations:
          resumen: "Mimir no recibe las métricas del respaldo de Zitadel"
          descripcion: >-
            `/var/lib/yggdrasil-thor/hive_idp_respaldo.prom` no existe o no se sirve en nidavellir. Lo escribe
            cada pasada de hive-idp-respaldo.service.

  # --- Eventos de seguridad de Hive (HIG-140, Gate 5) ------------------------------------------------
  # hive-seguridad.timer de nidavellir cuenta cada minuto en los logs de Hive y deja los contadores en
  # hive_seguridad.prom (job hive_seguridad). Qué cuenta cada `evento` y la prueba que fija sus frases están
  # en docs/06-monitoring/eventos-de-seguridad.md de Hive. Los contadores salen a 0 aunque no pase nada, así
  # que increase() siempre tiene de dónde partir; si el contador pierde su estado y vuelve a 0, Prometheus
  # lo trata como un reinicio.
  #
  # Los umbrales parten de la pasada de prueba del 2026-11-16 sobre 48 h de producción: 4 rechazos de
  # /oauth/token y ningún otro evento. Lo que en uso normal no pasa nunca avisa a la primera; los rechazos de
  # tokens, que sí pasan (un reloj desfasado, una aserción caducada), avisan cuando se repiten.
  - name: hive-seguridad
    rules:
      # Diez en 10 min es el doble de lo que se vio en 48 h, y en poco tiempo: alguien prueba claves o
      # aserciones robadas o caducadas, o un cliente tiene un bucle con la suya mal.
      - alert: HiveTokenRechazosRepetidos
        expr: sum(increase(hive_seguridad_eventos_total{evento="token_rechazado"}[10m])) >= 10
        labels:
          severity: warning
          servicio: hive
        annotations:
          resumen: "Hive rechaza muchas peticiones de token en /oauth/token"
          descripcion: >-
            Diez o más rechazos en 10 min. Cada línea dice el motivo: en nidavellir, `docker logs hive-api
            --since 15m 2>&1 | grep -E 'Rejected (a request|an exchange) for an access token'`. Si es siempre el
            mismo cliente, revisar su clave; si son muchos orígenes, es un intento de entrar.

      # El freno de /oauth/token solo actúa cuando un origen o una persona pasa su límite.
      - alert: HiveTokenFrenado
        expr: sum(increase(hive_seguridad_eventos_total{evento="token_frenado"}[10m])) > 0
        labels:
          severity: warning
          servicio: hive
        annotations:
          resumen: "El límite de /oauth/token frenó peticiones"
          descripcion: >-
            Un origen o una persona pasó su límite de tokens: fuerza bruta o un cliente en bucle. En nidavellir,
            `docker logs hive-api --since 15m 2>&1 | grep 'Turned away'` dice cuál.

      - alert: HiveRutasDenegadas
        expr: sum(increase(hive_seguridad_eventos_total{evento="ruta_denegada"}[10m])) >= 5
        labels:
          severity: warning
          servicio: hive
        annotations:
          resumen: "Hive deniega rutas a un rol que no las tiene"
          descripcion: >-
            Cinco o más en 10 min: un analista, el motor o un cliente pide lo que su rol no le deja. En
            nidavellir, `docker logs hive-api --since 15m 2>&1 | grep 'was denied'` dice el rol y el cliente.

      # Meta firma todos sus avisos y no repite la verificación: uno solo ya es de otro.
      - alert: HiveWebhookRechazado
        expr: >-
          sum by (evento) (
            increase(hive_seguridad_eventos_total{evento=~"firma_webhook|verificacion_webhook"}[10m])
          ) > 0
        labels:
          severity: warning
          servicio: hive
        annotations:
          resumen: "El webhook de Hive rechazó avisos que no son de Meta ({{ $labels.evento }})"
          descripcion: >-
            Alguien que no es Meta llama al webhook: sin firma o con una firma mala, o con un verifyToken
            equivocado. En nidavellir, `docker logs hive-webhook --since 15m 2>&1 | grep 'Rejected webhook'`
            dice el chatbot. Si son muchos o siguen, el secreto de la app o el verifyToken pueden estar
            filtrados.

      # Un bot en ERR deja de responder a sus contactos hasta que su cliente le pone un token nuevo.
      - alert: HiveBotEnError
        expr: sum(increase(hive_seguridad_eventos_total{evento="bot_err"}[10m])) > 0
        labels:
          severity: critical
          servicio: hive
        annotations:
          resumen: "Meta rechazó el token de un bot de Hive, que pasa a ERR"
          descripcion: >-
            El bot no responde hasta que su cliente le pone un token nuevo. En nidavellir, `docker logs
            hive-ingest --since 15m 2>&1 | grep 'is now ERR'` (o hive-api, hive-webhook) dice el bot, el cliente
            y el código de Meta. Un token revocado sin que el cliente lo pidiera puede ser una filtración.

      # Como BifrostCaido: al menos un fallo en cada ventana de 5 min durante 6 min seguidos. Un fallo suelto
      # no llega. Con el contenedor caído avisan también BifrostCaido o ServicioDePlataformaCaido; esta mira
      # lo que esas no ven: un contenedor sano que Hive no puede usar (credenciales, red, Atlas).
      - alert: HiveDependenciaFallando
        expr: >-
          sum by (evento) (
            increase(hive_seguridad_eventos_total{evento=~"andvari|bifrost|mongodb"}[5m])
          ) > 0
        for: 6m
        labels:
          severity: critical
          servicio: hive
        annotations:
          resumen: "Hive no puede usar {{ $labels.evento }} desde hace más de 6 min"
          descripcion: >-
            Las rutas que lo necesitan dan 503 y los mensajes no avanzan. En nidavellir, `docker ps` y los logs
            de hive-api, hive-webhook, hive-ingest y del motor. Andvari: `bao status`; Bifröst: `docker logs
            bifrost-nats`; MongoDB: el estado de Atlas.

      # Sin el fichero, o con el contador parado, ninguna de las de arriba puede saltar. Si es todo
      # nidavellir, ya avisa ThorSinMetricas.
      - alert: HiveSeguridadSinMetricas
        expr: >-
          (
            up{job="hive_seguridad"} == 0
            or (time() - hive_seguridad_ultima_pasada_segundos) > 300
          )
          unless on () (up{job="thor",host="nidavellir"} == 0)
        for: 10m
        labels:
          severity: warning
          servicio: hive
        annotations:
          resumen: "Mimir no recibe los eventos de seguridad de Hive"
          descripcion: >-
            Sin ellos no avisa ninguna alerta de seguridad de Hive. En nidavellir: `systemctl list-timers
            hive-seguridad.timer`, `journalctl -u hive-seguridad` y que exista
            `/var/lib/yggdrasil-thor/hive_seguridad.prom`.

      # Lo que escribió un contenedor que no se pudo leer no se cuenta. Si está caído, ya avisa Thor.
      - alert: HiveSeguridadContenedorSinLeer
        expr: hive_seguridad_contenedor_leido == 0
        for: 15m
        labels:
          severity: warning
          servicio: hive
        annotations:
          resumen: "El contador de seguridad de Hive no puede leer {{ $labels.contenedor }}"
          descripcion: >-
            Lo que escribe ese contenedor no se cuenta. En nidavellir:
            `docker logs --tail 1 {{ $labels.contenedor }}` y `journalctl -u hive-seguridad`.
