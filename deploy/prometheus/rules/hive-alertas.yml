# Alertas de las piezas de Hive que viven en la plataforma: Bifröst (NATS), el bus del motor, y Zitadel,
# el IdP de las personas (ADR-0029 de Hive). Desde el 2026-11-02 las dos corren en nidavellir (ADR-0012,
# fase 2). Sin etiqueta `wan`: Nornas las entrega por ntfy.
#
# Un contenedor en bucle de reinicios responde de vez en cuando: el 2026-10-28 `bifrost-nats` pasó 77 min
# reiniciándose cada minuto, la muestra suelta en que estaba en marcha volvía a poner a cero el `for` de
# ServicioDePlataformaCaido y el aviso llegó 33 min tarde. Por eso BifrostCaido no mira la última muestra.
groups:
  - name: hive
    rules:
      # --- Bifröst ---------------------------------------------------------------------------------
      # Hasta el 2026-11-02 era una sonda de blackbox al `/healthz` de NATS en el loopback de midgard. En
      # nidavellir ese puerto no sale del host, así que mira la salud del contenedor que publica Thor de
      # nidavellir una vez por minuto (la del healthcheck de la imagen, que pide `/healthz` con JetStream).
      # Thor cuenta como sano un contenedor recién arrancado, y en un bucle de reinicios alguna muestra sale
      # sana: avisa cuando hay al menos una muestra mala en cada ventana de 5 min durante 6 min seguidos.
      # Un fallo suelto no llega, porque su ventana dura 5 min. Si es todo nidavellir, avisa ThorSinMetricas.
      - alert: BifrostCaido
        expr: min_over_time(yggdrasil_servicio_ok{tipo="contenedor",nombre="bifrost-nats"}[5m]) == 0
        for: 6m
        labels:
          severity: critical
          servicio: bifrost
        annotations:
          resumen: "Bifröst (NATS) no está sano: el motor de Hive no procesa mensajes"
          descripcion: >-
            El contenedor `bifrost-nats` de nidavellir no está sano o se reinicia. Revisar `docker logs bifrost-nats`.
            Con `Can't start JetStream`, comprobar que el almacén está montado: `findmnt /var/lib/bifrost` debe
            mostrar `[/srv/datos/bifrost]`.

      # --- Zitadel ---------------------------------------------------------------------------------
      # Solo si la casa tiene ruta: sin ella ya salta HogarSinRuta.
      - alert: ZitadelExternoCaido
        expr: >-
          avg_over_time(probe_success{job="zitadel_externo"}[3m]) < 0.5
          unless on () (hogar:ruta_up == 0)
        for: 1m
        labels:
          severity: critical
          servicio: zitadel
        annotations:
          resumen: "Zitadel (hive-auth.higerotech.com) no responde desde fuera"
          descripcion: >-
            Las personas no pueden entrar y hive-api no valida sus tokens. En nidavellir: `docker ps --filter
            name=hive-idp` y `docker logs hive-idp-tunel`. Si nidavellir no responde, salta también
            ThorSinMetricas.

      # El respaldo es diario (03:30 UTC) y Persistent=true lo recupera tras un apagón: 26 h dan dos horas
      # de margen sobre la pasada siguiente.
      - alert: ZitadelRespaldoAtrasado
        expr: time() - hive_idp_respaldo_ultimo_exito_segundos > 26 * 3600
        for: 10m
        labels:
          severity: warning
          servicio: zitadel
        annotations:
          resumen: "El respaldo de Zitadel lleva más de 26 h sin salir bien"
          descripcion: >-
            Revisar `systemctl status hive-idp-respaldo` y `journalctl -u hive-idp-respaldo` en nidavellir, y
            que `/mnt/nas/respaldos` esté montado.

      # La pasada deja el 0 hasta la siguiente: la alerta dura lo que dura el fallo.
      - alert: ZitadelRespaldoFallido
        expr: hive_idp_respaldo_resultado == 0
        for: 5m
        labels:
          severity: warning
          servicio: zitadel
        annotations:
          resumen: "La última pasada del respaldo de Zitadel falló"
          descripcion: >-
            El motivo está en `journalctl -u hive-idp-respaldo` en nidavellir. Lanzarla otra vez tras arreglarlo:
            `sudo systemctl start hive-idp-respaldo.service`.

      # Sin el fichero, las dos de arriba no pueden saltar. Si es todo nidavellir, ya avisa ThorSinMetricas.
      - alert: ZitadelRespaldoSinMetricas
        expr: >-
          up{job="hive_idp_respaldo"} == 0
          unless on () (up{job="thor",host="nidavellir"} == 0)
        for: 30m
        labels:
          severity: warning
          servicio: zitadel
        annotations:
          resumen: "Mimir no recibe las métricas del respaldo de Zitadel"
          descripcion: >-
            `/var/lib/yggdrasil-thor/hive_idp_respaldo.prom` no existe o no se sirve en nidavellir. Lo escribe
            cada pasada de hive-idp-respaldo.service.
