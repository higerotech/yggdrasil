# Ratatosk — Mosquitto 2, bus de eventos de Yggdrasil (ADR-0006).
# Un único listener con autenticación obligatoria para todos los clientes (Nornas e IoT)
# y ACL por usuario (control T3 del threat model). Al arrancar, el command del contenedor genera el
# archivo de contraseñas desde .env y copia la ACL al volumen de datos con dueño mosquitto (Mosquitto
# rechazará en versiones futuras archivos de seguridad que no sean de su grupo).
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Límites (STRIDE · DoS): un bus doméstico no necesita más
max_connections 50
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 65536
