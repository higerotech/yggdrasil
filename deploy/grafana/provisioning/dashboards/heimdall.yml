# Odín (Grafana): dashboards de Heimdall cargados desde archivo (solo lectura en la UI).
apiVersion: 1
providers:
  - name: heimdall
    folder: Heimdall
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards/heimdall
      foldersFromFilesStructure: false
