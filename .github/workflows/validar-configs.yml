# Validación de los artefactos de deploy/ (Gate 2: "configuración validada" equivale al SAST,
# Trivy/Gitleaks a deps verificadas y secretos). Solo valida: el despliegue al appliance es
# `git pull && docker compose up -d` (ADR-0002), sin pipeline push hacia la red doméstica.
name: Validar configs

on:
  pull_request:
    paths:
      - "deploy/**"
      - "hlidskjalf/**"
      - ".github/workflows/validar-configs.yml"
  push:
    branches: [develop, main]
    paths:
      - "deploy/**"
      - "hlidskjalf/**"
  schedule:
    - cron: "17 6 * * 1"   # lunes 06:17 UTC: informe semanal de Trivy sobre las imágenes pineadas

permissions:
  contents: read

env:
  PROM: prom/prometheus:v3.14.0
  AM: prom/alertmanager:v0.34.0
  BB: prom/blackbox-exporter:v0.28.0
  GRAFANA: grafana/grafana:12.4.10
  MOSQ: eclipse-mosquitto:2.0.22
  NODERED: nodered/node-red:4.1.14-22

jobs:
  configs:
    name: "Configs: compose, promtool, amtool, blackbox, JSON"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renderizar plantillas con valores de prueba (RFC 5737)
        working-directory: deploy
        run: |
          cp .env.example .env
          WAN1_IP=192.0.2.101 WAN2_IP=192.0.2.102 ./scripts/render.sh --sin-recarga
      - name: docker compose config (base y CD)
        working-directory: deploy
        run: |
          docker compose config -q
          IMAGE_TAG=sha-0000000 docker compose -f docker-compose.cd.yml config -q
      - name: promtool check config y rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool "$PROM" check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool "$PROM" check rules /etc/prometheus/rules/heimdall-recording.yml /etc/prometheus/rules/heimdall-alertas.yml /etc/prometheus/rules/bragi-alertas.yml /etc/prometheus/rules/thor-alertas.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool "$PROM" test rules /etc/prometheus/tests/thor-alertas.test.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool "$PROM" test rules /etc/prometheus/tests/wan-up.test.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool "$PROM" test rules /etc/prometheus/tests/perdida.test.yml
          python3 deploy/prometheus/tests/intervalos.py   # 2 x intervalo < lookback: series consultables
      - name: amtool check-config
        run: docker run --rm -v "$PWD/deploy/alertmanager:/cfg:ro" --entrypoint amtool "$AM" check-config /cfg/alertmanager.yml
      - name: blackbox --config.check
        run: docker run --rm -v "$PWD/deploy/blackbox:/cfg:ro" "$BB" --config.check --config.file=/cfg/blackbox.yml
      - name: settings.js e init de Nornas (sintaxis)
        run: |
          docker run --rm -v "$PWD/deploy/nornas:/n:ro" --entrypoint node "$NODERED" --check /n/settings.js
          docker run --rm -v "$PWD/deploy/nornas:/n:ro" --entrypoint node "$NODERED" --check /n/init/importar-flujo.mjs
      - name: Pruebas del flujo de Nornas (avisos únicos, ntfy y tablero Hlidskjalf)
        run: docker run --rm -v "$PWD/deploy/nornas:/n:ro" --entrypoint node "$NODERED" --test /n/tests/flujo.test.mjs /n/tests/hlidskjalf.test.mjs
      - name: JSON del dashboard y flujo de Nornas sincronizado con src/
        run: |
          python3 -m json.tool deploy/grafana/dashboards/heimdall-sla.json > /dev/null
          python3 deploy/nornas/generar-flujo.py
          git diff --exit-code -- deploy/nornas/flows/   # el JSON committeado debe salir de src/*.js
      - name: Configs renderizadas montadas como directorio (blackbox real, con control negativo)
        run: bash deploy/tests/prueba-montaje-config.sh
      - name: Construir Sleipnir y sync
        working-directory: deploy
        run: |
          docker compose build sleipnir
          docker build -q -t yggdrasil-sync:ci sync/
      - name: ShellCheck de los scripts
        run: |
          docker run --rm -v "$PWD/deploy:/mnt:ro" koalaman/shellcheck:v0.10.0 -S warning /mnt/scripts/render.sh /mnt/scripts/deploy.sh /mnt/sleipnir/sleipnir.sh /mnt/sleipnir/tests/prueba-sleipnir.sh /mnt/sync/sync.sh /mnt/cd/bootstrap-midgard.sh /mnt/cd/yggdrasil-respaldar.sh /mnt/cd/yggdrasil-respaldo-aviso.sh /mnt/cd/yggdrasil-vigia-servicios.sh /mnt/cd/yggdrasil-thor.sh /mnt/cd/tests/prueba-thor.sh /mnt/cd/tests/prueba-vigia-servicios.sh /mnt/host/wan-balancer.sh /mnt/host/wan-watchdog.sh /mnt/host/install-host.sh /mnt/host/tests/prueba-sandbox-guardian.sh /mnt/host/tests/prueba-quorum.sh /mnt/tests/prueba-montaje-config.sh

  guardian:
    name: "Guardián: render.sh dentro del sandbox de wan-watchdog"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render con las directivas de sandbox de la unidad (y control negativo)
        run: sudo bash deploy/host/tests/prueba-sandbox-guardian.sh
      - name: Quórum TCP de cada WAN en balanceador y guardián (ip, ping y curl simulados)
        run: bash deploy/host/tests/prueba-quorum.sh
      - name: Thor, recolector del host (smartctl, df, timeout e ip simulados)
        run: bash deploy/cd/tests/prueba-thor.sh
      - name: Vigía de servicios (docker, systemctl y curl simulados)
        run: bash deploy/cd/tests/prueba-vigia-servicios.sh
      - name: Sleipnir en sus tres modos (speedtest, speedtest-cli, iperf3, ip y httpd simulados)
        run: bash deploy/sleipnir/tests/prueba-sleipnir.sh

  hlidskjalf:
    name: "Hlidskjalf: APK de la tablet de pared"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SDK de Android (plataforma 25 y build-tools 34.0.0)
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-25" "build-tools;34.0.0" > /dev/null
      - name: Compilar y firmar (clave de depuración efímera del runner)
        run: |
          export PATH="$JAVA_HOME_17_X64/bin:$PATH"
          bash hlidskjalf/construir.sh
      - name: ShellCheck de los scripts de la tablet
        run: docker run --rm -v "$PWD/hlidskjalf:/mnt:ro" koalaman/shellcheck:v0.10.0 -S warning /mnt/construir.sh /mnt/instalar.sh

  secretos:
    name: "Secretos: gitleaks"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks detect
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source /repo --no-banner --redact --exit-code 1

  imagenes:
    name: "Cadena de suministro: Trivy (informe)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config (misconfiguraciones en deploy/)
        run: docker run --rm -v "$PWD/deploy:/deploy:ro" aquasec/trivy:0.66.0 config --exit-code 0 --severity HIGH,CRITICAL /deploy
      - name: Trivy image (CRITICAL/HIGH, sin bloquear hasta triaje)
        run: |
          for img in "$PROM" "$AM" "$BB" "$GRAFANA" "$MOSQ" "$NODERED"; do
            echo "== $img =="
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed "$img"
          done
