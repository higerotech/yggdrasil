# Construye y publica en GHCR las dos imágenes propias de Yggdrasil (Sleipnir y sync) con el tag
# sha-<7> del commit. Al terminar con éxito, GitHub emite workflow_run al receptor de
# despliegue-continuo (ADR-0005), que despliega ese mismo SHA en midgard. El nombre 'build'
# debe coincidir con el campo `workflow` de la entrada de Yggdrasil en apps.yml.
name: build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        imagen: [sleipnir, sync]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.imagen }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: deploy/${{ matrix.imagen }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}
