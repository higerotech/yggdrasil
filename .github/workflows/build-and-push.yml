# Construye y publica en GHCR las dos imágenes propias de Yggdrasil (Sleipnir y sync) con el tag
# sha-<7> del commit. Al terminar con éxito, GitHub emite workflow_run al receptor de
# despliegue-continuo (ADR-0005), que despliega ese mismo SHA en midgard. El nombre 'build'
# debe coincidir con el campo `workflow` de la entrada de Yggdrasil en apps.yml.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:      # segundo despliegue cuando el commit cambia el Compose (ver job redespliegue)

permissions:
  contents: read
  packages: write
  actions: write        # para relanzarse a si mismo (redespliegue)

# El grupo incluye el evento: el relanzamiento (workflow_dispatch) que pide `redespliegue` no debe
# cancelar la ejecucion del push que lo lanzo. Con un solo grupo, esa cancelacion dejaba el run
# del push con conclusion 'cancelled', el receptor lo ignoraba y solo habia un despliegue (v0.4.3).
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        imagen: [sleipnir, sync]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.imagen }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: deploy/${{ matrix.imagen }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}

  # El receptor levanta el stack con el Compose del checkout ANTERIOR (sync-host lo actualiza
  # durante el propio despliegue). Si este push cambio docker-compose*.yml, se dispara un segundo
  # workflow_run (workflow_dispatch) para que el receptor vuelva a desplegar con el Compose nuevo.
  redespliegue:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Relanzar si cambio el Compose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^deploy/docker-compose(\.cd)?\.yml$'; then
            echo 'El commit cambia el Compose: se pide un segundo despliegue'
            gh workflow run build-and-push.yml --ref main
          else
            echo 'El Compose no cambio; no hace falta redesplegar'
          fi
